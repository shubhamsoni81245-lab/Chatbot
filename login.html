<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Poornima University</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header" style="animation: fadeInDown 0.8s ease-out forwards;">
                <div class="logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1>Admin <span class="highlight">Portal</span></h1>
                <p>Please enter your credentials to continue</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group" style="animation: fadeInUp 0.5s ease-out 0.2s forwards; opacity: 0;">
                    <label for="username">Username or Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="text" id="username" placeholder="admin@gmail.com" required>
                    </div>
                </div>

                <div class="form-group" style="animation: fadeInUp 0.5s ease-out 0.3s forwards; opacity: 0;">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="eye-btn">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options" style="animation: fadeInUp 0.5s ease-out 0.4s forwards; opacity: 0;">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Keep me logged in
                    </label>
                    <a href="reset-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn"
                    style="animation: fadeInUp 0.5s ease-out 0.5s forwards; opacity: 0;">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <button type="button" id="google-login-btn" class="submit-btn google-btn"
                    style="animation: fadeInUp 0.5s ease-out 0.6s forwards; opacity: 0; background-color: #fff; color: #757575; border: 1px solid #ddd; margin-top: 15px; display: flex; justify-content: center; gap: 10px; font-weight: 500;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo"
                        style="width: 20px; height: 20px;">
                    <span>Continue with Google</span>
                </button>
            </form>

            <div class="login-footer" style="animation: fadeIn 1s ease-out 0.7s forwards; opacity: 0;">
                <p>Not an administrator? <a href="index.html">Back to Home</a></p>
            </div>
        </div>

        <div class="bg-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
        </div>
    </div>

    <!-- Importmap for Firebase -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword } from "firebase/auth";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCJNlX4nS00qIxF0lW5AttjYEPOlcETb-Y",
            authDomain: "smart-collage-project.firebaseapp.com",
            projectId: "smart-collage-project",
            storageBucket: "smart-collage-project.firebasestorage.app",
            messagingSenderId: "157281122997",
            appId: "1:157281122997:web:e7e6654e1d0a0b2fbd5cfc",
            measurementId: "G-HQY0GNNNJG"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Google Login
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const btn = document.getElementById('google-login-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span>Connecting to Google...</span>';

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Store user info in localStorage for admin portal access
                localStorage.setItem('adminToken', user.accessToken);
                localStorage.setItem('adminUser', JSON.stringify({
                    id: user.uid,
                    username: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL
                }));
                localStorage.setItem('adminLoggedIn', 'true');

                window.location.href = 'admin.html';
            } catch (error) {
                console.error("Firebase Login Error:", error);
                alert('Google log in failed: ' + error.message);
                btn.innerHTML = originalHtml;
            }
        });

        // Email/Password Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.submit-btn');

            btn.classList.add('loading');
            btn.innerHTML = '<span>Verifying...</span>';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                localStorage.setItem('adminToken', user.accessToken);
                localStorage.setItem('adminUser', JSON.stringify({
                    id: user.uid,
                    username: user.displayName || email.split('@')[0],
                    email: user.email,
                    photoURL: user.photoURL || null
                }));
                localStorage.setItem('adminLoggedIn', 'true');

                window.location.href = 'admin.html';
            } catch (error) {
                console.error('Firebase Auth Error:', error);
                alert('Invalid credentials or sign-in failed. Error: ' + error.message);
                btn.classList.remove('loading');
                btn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        });

        // Toggle Password Visibility
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });
    </script>
</body>

</html>
