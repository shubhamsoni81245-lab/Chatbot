<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Reset | Poornima University</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Step 1: Email Input -->
            <div id="step-email" class="reset-step active">
                <div class="login-header" style="animation: fadeInDown 0.8s ease-out forwards;">
                    <div class="logo">
                        <i class="fa-solid fa-envelope-open-text"></i>
                    </div>
                    <h1>Reset <span class="highlight">Password</span></h1>
                    <p>Enter your email to receive a recovery OTP</p>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email-input" placeholder="admin@gmail.com" required>
                    </div>
                </div>
                <button type="button" id="send-otp-btn" class="submit-btn" style="margin-top: 20px;">
                    <span>Send Verification Code</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <!-- Step 2: OTP Entry -->
            <div id="step-otp" class="reset-step">
                <div class="login-header">
                    <div class="logo">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h1>Verify <span class="highlight">OTP</span></h1>
                    <p id="otp-status">Enter the 6-digit code sent to your email</p>
                </div>
                <div class="form-group">
                    <label>Verification Code</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="text" id="otp-input" placeholder="XXXXXX" maxlength="6"
                            style="letter-spacing: 5px; text-align: center; font-weight: 700;">
                    </div>
                </div>
                <button type="button" id="verify-otp-btn" class="submit-btn" style="margin-top: 20px;">
                    <span>Verify Code</span>
                    <i class="fa-solid fa-check-double"></i>
                </button>
                <button type="button" id="resend-otp" class="secondary-action-btn"
                    style="margin-top: 15px; border: none; background: none;">Resend OTP</button>
            </div>

            <!-- Step 3: New Password -->
            <div id="step-password" class="reset-step">
                <div class="login-header">
                    <div class="logo">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h1>New <span class="highlight">Password</span></h1>
                    <p>Finally, choose a secure new password</p>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="new-password" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-check"></i>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="button" id="generate-password" class="secondary-action-btn" style="margin-bottom: 20px;">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Generate Strong Password
                </button>
                <button type="button" id="finish-reset-btn" class="submit-btn">
                    <span>Change Password</span>
                    <i class="fa-solid fa-circle-check"></i>
                </button>
            </div>

            <div class="login-footer" style="animation: fadeIn 1s ease-out 0.7s forwards; opacity: 0;">
                <p>Remembered your password? <a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <style>
        .reset-step {
            display: none;
        }

        .reset-step.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .secondary-action-btn {
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            padding: 10px;
            width: 100%;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
        }

        .secondary-action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: var(--primary-color);
        }
    </style>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let userEmail = '';
        let verifiedCode = '';

        // Elements
        const stepEmail = document.getElementById('step-email');
        const stepOtp = document.getElementById('step-otp');
        const stepPassword = document.getElementById('step-password');

        const sendBtn = document.getElementById('send-otp-btn');
        const verifyBtn = document.getElementById('verify-otp-btn');
        const finishBtn = document.getElementById('finish-reset-btn');
        const generateBtn = document.getElementById('generate-password');

        // Step 1: Send OTP
        sendBtn.addEventListener('click', async () => {
            userEmail = document.getElementById('email-input').value;
            if (!userEmail) return alert("Please enter email");

            sendBtn.innerHTML = '<span>Processing...</span>';
            try {
                await new Promise(r => setTimeout(r, 800));
                stepEmail.classList.remove('active');
                stepOtp.classList.add('active');
                alert("For this demo, any 6 digit code will work: e.g. 123456");
            } catch (err) { alert("Error occurred"); }
            sendBtn.innerHTML = '<span>Send Verification Code</span> <i class="fa-solid fa-paper-plane"></i>';
        });

        // Step 2: Verify OTP
        verifyBtn.addEventListener('click', async () => {
            const code = document.getElementById('otp-input').value;
            if (code.length < 6) return alert("Enter 6 digit code");

            verifyBtn.innerHTML = '<span>Verifying...</span>';
            try {
                await new Promise(r => setTimeout(r, 800));
                verifiedCode = code;
                stepOtp.classList.remove('active');
                stepPassword.classList.add('active');
            } catch (err) { alert("Error occurred"); }
            verifyBtn.innerHTML = '<span>Verify Code</span> <i class="fa-solid fa-check-double"></i>';
        });

        // Generate strong password
        generateBtn.addEventListener('click', () => {
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
            let retVal = "";
            for (let i = 0; i < 16; i++) retVal += charset.charAt(Math.floor(Math.random() * charset.length));
            document.getElementById('new-password').value = retVal;
            document.getElementById('confirm-password').value = retVal;
            document.getElementById('new-password').type = 'text';
            generateBtn.innerHTML = '<i class="fa-solid fa-check"></i> Code Generated!';
            setTimeout(() => { generateBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generate Strong Password'; }, 2000);
        });

        // Step 3: Change Password
        finishBtn.addEventListener('click', async () => {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) return alert("Passwords don't match");

            finishBtn.innerHTML = '<span>Saving...</span>';
            try {
                await new Promise(r => setTimeout(r, 800));
                alert("Success! Your password is changed.");
                window.location.href = 'login.html';
            } catch (err) { alert("Error occurred"); }
            finishBtn.innerHTML = '<span>Change Password</span> <i class="fa-solid fa-circle-check"></i>';
        });

        // Resend OTP
        document.getElementById('resend-otp').addEventListener('click', () => sendBtn.click());
    </script>
</body>

</html>
